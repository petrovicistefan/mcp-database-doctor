name: Release

# Push a tag like v0.1.1 (after bumping version in package.json AND server.json) to publish to
# npm and the official MCP Registry. npm uses Trusted Publishing (OIDC), so no token is stored:
# on npmjs.com the package's trusted publisher must be this repository + workflow file release.yml.
on:
  push:
    tags: ["v*.*.*"]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run test:integration

  publish:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted Publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@latest
      - run: npm install --ignore-scripts
      - name: Versions agree
        run: |
          p=$(node -p 'require("./package.json").version')
          s=$(node -p 'require("./server.json").version')
          q=$(node -p 'require("./server.json").packages[0].version')
          test "v$p" = "$GITHUB_REF_NAME" && test "$s" = "$p" && test "$q" = "$p" || { echo "version mismatch: tag $GITHUB_REF_NAME package $p server.json $s/$q"; exit 1; }
      - name: Publish to npm (OIDC, with provenance)
        run: |
          v=$(node -p 'require("./package.json").version')
          if npm view "mcp-database-doctor@$v" version --prefer-online >/dev/null 2>&1; then
            echo "mcp-database-doctor@$v is already on npm, not publishing it again"
          else
            npm publish --provenance --access public
          fi
      # npm needs a few minutes to serve a new version, and the MCP Registry checks npm when it validates.
      - name: Wait until npm serves this version
        run: |
          v=$(node -p 'require("./package.json").version')
          for i in $(seq 1 40); do
            npm view "mcp-database-doctor@$v" version --prefer-online >/dev/null 2>&1 && { echo "npm serves $v"; exit 0; }
            sleep 15
          done
          echo "npm does not serve $v after 10 minutes"; exit 1
      - name: Publish to the official MCP Registry
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
